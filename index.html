    <script>
      // Gracefully ignore Vite client HMR/WebSocket transport errors when HMR is disabled in AI Studio
      window.addEventListener('error', function(event) {
        if (event && (
          (event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('createWebSocketModuleRunnerTransport') !== -1)) ||
          (event.filename && event.filename.indexOf('@vite/client') !== -1)
        )) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var str = String((event && event.reason && (event.reason.stack || event.reason.message)) || event && event.reason || '');
        if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1 || str.indexOf('createWebSocketModuleRunnerTransport') !== -1) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      });
    </script>
  </head>
